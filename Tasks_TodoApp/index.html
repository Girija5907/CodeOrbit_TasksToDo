<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks To Do · Organize your tasks. Stay productive.</title>
  <meta name="description" content="Girija_TodoApp - A modern, responsive To-Do List Web Application with localStorage persistence, filters, and progress tracking." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Main Application Container -->
  <main class="app-container" role="main">
    
    <!-- Application Header -->
    <header class="app-header">
      <div class="brand-wrapper">
        <div class="app-icon-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4" />
            <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" />
          </svg>
        </div>
        <div class="brand-text">
          <h1>Tasks To Do</h1>
          <p>Organize your tasks. Stay productive.</p>
        </div>
      </div>

      <!-- Header Action Buttons -->
      <div class="header-actions">
        <!-- Theme Toggle Button -->
        <button id="themeToggleBtn" class="theme-toggle-btn" type="button" aria-label="Toggle theme" title="Toggle theme">
          <!-- Sun Icon (shown in dark mode) -->
          <svg id="themeIconSun" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
          <!-- Moon Icon (shown in light mode) -->
          <svg id="themeIconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Add Task Section -->
    <section class="add-task-section" aria-label="Add new task">
      <form id="addTaskForm" class="add-task-form" autocomplete="off" novalidate>
        <div class="input-wrapper">
          <input
            type="text"
            id="taskInput"
            class="task-input"
            placeholder="Enter a new task..."
            aria-label="New task description"
            maxlength="200"
          />
        </div>
        <button type="submit" id="addTaskBtn" class="add-task-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          <span>Add Task</span>
        </button>
      </form>
      <!-- Validation Message -->
      <div id="validationMessage" class="validation-message" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <span class="error-text">Please enter a task description before adding.</span>
      </div>
    </section>

    <!-- Task Summary & Progress Section -->
    <section class="summary-panel" aria-label="Task metrics and progress">
      <div class="stats-grid">
        <div class="stat-item total">
          <span id="totalCount" class="stat-value">0</span>
          <span class="stat-label">Total Tasks</span>
        </div>
        <div class="stat-item pending">
          <span id="pendingCount" class="stat-value">0</span>
          <span class="stat-label">Pending</span>
        </div>
        <div class="stat-item completed">
          <span id="completedCount" class="stat-value">0</span>
          <span class="stat-label">Completed</span>
        </div>
      </div>

      <!-- Completion Progress Bar -->
      <div class="progress-container">
        <div class="progress-header">
          <span>Overall Progress</span>
          <div>
            <span id="progressRatio">0 of 0 tasks</span>
            <span aria-hidden="true"> · </span>
            <span id="progressPercent" class="progress-percent">0%</span>
          </div>
        </div>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </div>
    </section>

    <!-- Toolbar: Filters & Bulk Actions -->
    <section class="toolbar" aria-label="Task filters and options">
      <div class="filter-group" role="tablist" aria-label="Filter tasks">
        <button type="button" class="filter-btn active" data-filter="all" role="tab" aria-selected="true">
          <span>All Tasks</span>
          <span id="filterAllBadge" class="filter-badge">0</span>
        </button>
        <button type="button" class="filter-btn" data-filter="pending" role="tab" aria-selected="false">
          <span>Pending</span>
          <span id="filterPendingBadge" class="filter-badge">0</span>
        </button>
        <button type="button" class="filter-btn" data-filter="completed" role="tab" aria-selected="false">
          <span>Completed</span>
          <span id="filterCompletedBadge" class="filter-badge">0</span>
        </button>
      </div>

      <button type="button" id="clearCompletedBtn" class="clear-completed-btn" title="Clear all completed tasks" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6" />
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
        </svg>
        <span>Clear Completed</span>
      </button>
    </section>

    <!-- Task List Area -->
    <section class="task-list-section" aria-label="Task items list">
      <ul id="taskList" class="task-list" aria-live="polite">
        <!-- Rendered dynamically by script.js -->
      </ul>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state" style="display: none;">
        <div class="empty-state-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 12h6" />
            <path d="M12 9v6" />
            <circle cx="12" cy="12" r="10" />
          </svg>
        </div>
        <h3 id="emptyStateTitle">No tasks yet</h3>
        <p id="emptyStateDesc">Add your first task above to get organized and stay productive!</p>
      </div>
    </section>

  </main>

  <!-- Delete / Clear Confirmation Modal Dialog -->
  <div id="confirmModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-icon-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
        </div>
        <h3 id="modalTitle">Confirm Action</h3>
      </div>
      <div class="modal-body">
        <p id="modalDesc">Are you sure you want to proceed?</p>
        <span id="modalTargetText" class="modal-target-text"></span>
      </div>
      <div class="modal-actions">
        <button id="modalCancelBtn" class="modal-cancel-btn" type="button">Cancel</button>
        <button id="modalConfirmBtn" class="modal-confirm-btn" type="button">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Vanilla Application Script -->
  <script src="script.js"></script>
</body>
</html>
